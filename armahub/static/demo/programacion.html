<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programación de Cubicaciones</title>
<!--
  MAQUETA VISUAL — SIN LÓGICA (28-sep, 2ª vuelta). Página suelta para MIRAR: no guarda, no toca
  la base. Reemplaza a la 1ª vuelta, que el usuario rechazó por «textosa y sucia».

  REAL: 18 obras, 435 frentes (sector_estado) con su estado y sus kilos, y los cinco cubicadores.
  DE EJEMPLO: la asignación USC↔obra, quién hace cada frente y las fechas (no existen aún).

  LO QUE PIDIÓ EL USUARIO Y ORDENA ESTA VUELTA:
  · Una sola hoja, para MONITOREAR todo el día. Máximo tres pestañas: Equipo (todos ven todo),
    USC (programar desde el tablero) y Cubicador (mi semana).
  · Limpia: sin párrafos explicativos dentro de la página. Lo que hay que explicar va en la
    conversación, no en el producto.
  · Ciclos POR PISO, marcando sólo donde cambian: el subterráneo puede tener 20 y la torre 5.
    Los pisos se agregan/quitan; el nº de ciclos se escribe en el piso donde cambia y se hereda
    hacia arriba. De esa estructura se derivan los frentes — nadie los teclea ni los «genera».
  · Nada de desplegables.
-->
<style>
  :root{--ln:#e3e8ef;--mut:#78909c;--tx:#1f2a37;--bg:#f5f7fa;--verde:#8BC34A;--vos:#33691e;
        --amb:#f9a825;--rojo:#c62828}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--ln)}
  .top h1{margin:0;font-size:16px;font-weight:700}
  .maq{font-size:10px;font-weight:700;color:#e65100;background:#fff3e0;border:1px solid #ffcc80;border-radius:99px;padding:1px 8px}
  .sem{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-weight:600}
  .sem button{border:1px solid #cfd8dc;background:#fff;font:inherit;border-radius:5px;padding:3px 9px;cursor:pointer;color:#546e7a}
  .tabs{display:flex;gap:2px;padding:0 18px;background:#fff;border-bottom:1px solid var(--ln)}
  .tabs button{border:0;background:transparent;padding:9px 16px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--vos);border-bottom-color:var(--verde)}
  main{padding:14px 18px 40px}
  section{display:none} section.on{display:block}
  .card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:12px 14px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mut{color:var(--mut);font-size:11px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfd8dc;background:#fff;border-radius:99px;padding:3px 10px;font:inherit;font-size:11px;font-weight:600;color:#546e7a;cursor:pointer}
  .pill.on{background:#f1f8e9;border-color:var(--verde);color:var(--vos)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%}
  .usc{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none}
  button.b{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border:none;border-radius:5px;background:var(--verde);color:#fff;cursor:pointer}
  button.b.g{background:#fff;color:#546e7a;border:1px solid #cfd8dc}
  input[type=date],input[type=text]{font:inherit;font-size:12px;padding:4px 7px;border:1px solid #cfd8dc;border-radius:5px;background:#fff}

  /* KPIs: una línea */
  .kpis{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;padding:0 2px 10px}
  .kpi b{font-size:20px;font-weight:700} .kpi span{font-size:11px;color:var(--mut);margin-left:5px}
  .kpi.ok b{color:#2e7d32} .kpi.ojo b{color:#e65100}

  /* tablero */
  .board{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;table-layout:fixed}
  .board th{background:#fafbfc;border-bottom:1px solid var(--ln);padding:7px 6px;text-align:center;font-weight:600;color:#546e7a}
  .board th.q{text-align:left;width:150px}
  .board th.hoy{color:var(--vos)}
  .board td{border-bottom:1px solid #edf0f3;border-right:1px solid #f0f2f5;vertical-align:top;padding:5px;height:78px}
  .board td.q{font-weight:600;vertical-align:middle}
  .board td.q small{display:block;font-weight:400;color:var(--mut);font-size:10.5px}
  .board td.hoy{background:#fbfdf8}
  .board td.dest{background:#f1f8e9;cursor:pointer;box-shadow:inset 0 0 0 2px var(--verde)}
  .board td.choque{background:#fff5f5;box-shadow:inset 0 0 0 2px var(--rojo)}
  .chip{display:block;border-radius:4px;padding:2px 6px;margin-bottom:3px;font-size:10.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.tarde{box-shadow:inset 0 0 0 2px var(--amb)}
  .chip.ok{opacity:.55;text-decoration:line-through}
  .leg{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--mut)}
  .leg b{color:#e65100}

  /* Equipo: obras + calendario mensual compacto + lista */
  .eq-lay{display:grid;grid-template-columns:250px 1fr;gap:12px;align-items:start}
  @media(max-width:1000px){.eq-lay{grid-template-columns:1fr}}
  /* una línea por obra: nombre recortado con «…», badge del USC y pendientes/total a la derecha */
  .obras{max-height:340px;overflow:auto}
  .obras .o{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:11px;border:1px solid transparent;white-space:nowrap}
  .obras .o:hover{background:#f5f7fa} .obras .o.on{background:#f1f8e9;border-color:#c5e1a5}
  .obras .o .usc{width:17px;height:17px;font-size:8.5px}
  .obras .o .n{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .obras .o .k{font-size:10.5px;color:var(--mut);flex:none;font-variant-numeric:tabular-nums} .obras .o .k b{color:#e65100}
  .cal{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px}
  .cal th{background:#fafbfc;border-bottom:1px solid var(--ln);padding:5px 4px;text-align:center;font-weight:600;color:#546e7a}
  .cal th.w{width:74px;text-align:left}
  .cal td{border-bottom:1px solid #edf0f3;border-right:1px solid #f0f2f5;vertical-align:top;padding:3px 4px;height:58px}
  .cal td.w{font-weight:600;color:#546e7a;vertical-align:middle;font-size:11px;background:#fafbfc}
  .cal td.w small{display:block;font-weight:400;color:var(--mut);font-size:10px}
  .cal tr.hoy td.w{color:var(--vos)} .cal td.hoy{background:#fbfdf8}
  .cal td.pas{background:#fafafa;color:#b0bec5}
  .cal .chip{font-size:9.5px;padding:1px 5px;margin-bottom:2px;border-radius:3px}
  .cal .mas{display:block;font-size:9.5px;color:var(--mut);padding-left:3px}
  .cal .ch{display:block;font-size:9.5px;color:var(--rojo);font-weight:700;margin-bottom:2px}
  .cal td.choque{box-shadow:inset 0 0 0 2px var(--rojo);background:#fff5f5}
  .lista{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  .lista th{text-align:left;color:#546e7a;font-weight:600;padding:5px 7px;border-bottom:1px solid var(--ln);white-space:nowrap}
  .lista td{padding:4px 7px;border-top:1px solid #edf0f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lista tbody tr:nth-child(even) td{background:#fafbfc}
  .lista tr.hecho td{color:#b0bec5} .lista tr.atr td:first-child{color:var(--rojo);font-weight:700}
  .lista .st{font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
  .st.p{background:#eceff1;color:#546e7a} .st.h{background:#e8f5e9;color:#2e7d32} .st.a{background:#ffebee;color:#c62828} .st.t{background:#fff8e1;color:#8d6e00}

  /* USC: cola + tablero */
  .usc-lay{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
  @media(max-width:1000px){.usc-lay{grid-template-columns:1fr}}
  .cola{max-height:calc(100vh - 210px);overflow:auto;padding-right:2px}
  .ob{border:1px solid var(--ln);border-radius:7px;margin-bottom:7px;background:#fff}
  .ob>.h{display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer;font-weight:600;font-size:12px}
  .ob>.h .n{flex:1;line-height:1.2} .ob>.h .c{font-size:11px;color:#e65100;font-weight:700}
  .ob>.h .cfg{color:#b0bec5;font-weight:400;font-size:13px;padding:0 3px} .ob>.h .cfg:hover{color:#546e7a}
  .ob .fr{display:none;padding:2px 8px 8px;gap:4px;flex-wrap:wrap}
  .ob.on .fr{display:flex}
  .f{border:1px solid #dfe4ea;border-radius:5px;padding:3px 7px;font-size:11px;cursor:pointer;background:#fff;line-height:1.2}
  .f:hover{border-color:var(--verde)} .f.on{border-color:var(--verde);background:#f1f8e9;box-shadow:0 0 0 2px rgba(139,195,74,.25)}
  .f small{display:block;color:var(--mut);font-size:9.5px}
  .pop{border:1px solid #c5e1a5;background:#f7faf3;border-radius:7px;padding:9px 11px;margin:4px 8px 8px}
  .pop .row{gap:8px}
  .pop .warn{margin-top:7px;font-size:11px;color:#8d6e00;background:#fff8e1;border:1px solid #ffe082;border-radius:5px;padding:5px 8px;display:none}
  .pop .warn.on{display:block}

  /* cubicador */
  .mi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .dia{border:1px solid var(--ln);border-radius:7px;background:#fff;min-height:220px}
  .dia>.h{padding:6px 9px;border-bottom:1px solid var(--ln);font-weight:600;color:#546e7a;font-size:11.5px;background:#fafbfc}
  .dia>.h.hoy{color:var(--vos)}
  .t{margin:6px;border:1px solid #e6e9ed;border-radius:6px;padding:6px 8px;font-size:11.5px;border-left-width:4px}
  .t .o{font-weight:700} .t .fr{color:#37474f} .t .m{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--mut);font-size:10.5px}
  .t.hecho{opacity:.55} .t.tarde .fr::after{content:" · < 7 días";color:#e65100;font-size:10px}

  /* USC: tres cajas + calendario de números */
  .usc3{display:grid;grid-template-columns:220px 250px 1fr;gap:12px;align-items:start}
  @media(max-width:1100px){.usc3{grid-template-columns:1fr 1fr;} .usc3 .c3{grid-column:1/-1}}
  .usc3 .card{padding:9px 11px} .usc3 .h{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .c2 .t{display:flex;align-items:center;gap:7px;padding:3px 4px;border-top:1px solid #f0f2f5;font-size:11.5px;cursor:pointer}
  .c2 .t:first-of-type{border-top:0} .c2 .t small{color:var(--mut);font-size:10px;margin-left:auto}
  .c2 .lista2{max-height:300px;overflow:auto}
  .c3 .lista td{white-space:nowrap} .c3 input[type=date]{font-size:11px;padding:2px 5px} .c3 input.ton{width:46px;text-align:right;font-size:11px;padding:2px 4px}
  .c3 .cb{cursor:pointer;border-bottom:1px dashed #b0bec5} .c3 .q{border:0;background:none;color:#cfd8dc;cursor:pointer} .c3 .q:hover{color:var(--rojo)}
  .f7{background:#fff8e1;color:#8d6e00;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;white-space:nowrap}
  .cal2{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
  .cal2 th{background:#fafbfc;border-bottom:1px solid var(--ln);padding:6px 4px;text-align:center;font-weight:600;color:#546e7a}
  .cal2 th.q{text-align:left;width:150px} .cal2 th.hoy{color:var(--vos)}
  .cal2 td{border-bottom:1px solid #edf0f3;border-right:1px solid #f0f2f5;text-align:center;padding:7px 4px;font-weight:600;color:#37474f}
  .cal2 td.q{text-align:left;cursor:pointer} .cal2 td.q:hover{color:var(--vos)} .cal2 td.q.on{color:var(--vos);box-shadow:inset 3px 0 0 var(--verde)}
  .cal2 td small{display:block;font-weight:400;color:var(--mut);font-size:10px}
  .cal2 td.hoy{background:#fbfdf8} .cal2 td.vac{color:#cfd8dc;font-weight:400}
  .cal2 td.choque{background:#fff5f5;box-shadow:inset 0 0 0 2px var(--rojo);color:var(--rojo)}
  .cal2 td.tot{background:#fafbfc;color:var(--vos)}
  .t button{font:inherit;font-size:10.5px;padding:2px 8px;border:1px solid #cfd8dc;background:#fff;border-radius:4px;cursor:pointer;color:#546e7a}

  /* estructura de la obra (panel lateral) */
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:50}
  .drawer.on{display:block}
  .drawer .p{position:absolute;top:0;right:0;bottom:0;width:560px;max-width:96vw;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.15);overflow:auto;padding:16px 18px}
  .drawer h2{margin:0;font-size:15px} .drawer .x{float:right;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut)}
  .pisos{border:1px solid var(--ln);border-radius:7px;overflow:hidden;margin-top:10px}
  .pi{display:grid;grid-template-columns:70px 90px 1fr 32px;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid #f0f2f5;font-size:12px}
  .pi:first-child{border-top:0}
  .pi .nom{font-weight:600}
  .pi .cic{display:inline-flex;align-items:center;gap:5px}
  .pi .cic input{width:46px;text-align:center;font-weight:700;color:var(--vos);border-color:var(--verde)}
  .pi .cic .her{color:#b0bec5;font-weight:600;width:46px;text-align:center;cursor:pointer;border:1px dashed #dfe4ea;border-radius:5px;padding:3px 0}
  .pi .cic .her:hover{border-color:var(--verde);color:var(--vos)}
  .pi .pl{display:inline-flex;align-items:center;gap:8px}
  .pi .img{width:64px;height:40px;border:1px dashed #dfe4ea;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#b0bec5;cursor:pointer}
  .pi .img.ok{border-style:solid}
  .pi .q{border:0;background:none;color:#cfd8dc;cursor:pointer;font-size:14px} .pi .q:hover{color:var(--rojo)}
  .addp{width:100%;border:1px dashed #dfe4ea;background:#fff;font:inherit;font-size:11.5px;color:#78909c;padding:5px;cursor:pointer}
  .addp:hover{border-color:var(--verde);color:var(--vos)}
</style>
</head>
<body>
<div class="top">
  <h1>Programación</h1><span class="maq">MAQUETA</span>
  <span class="mut" id="intro"></span>
  <span class="sem"><button id="semAnt">‹</button><span id="semTxt"></span><button id="semSig">›</button></span>
</div>
<div class="tabs" id="tabs">
  <button data-v="equipo" class="on">Equipo</button>
  <button data-v="usc">USC</button>
  <button data-v="cub">Cubicador</button>
</div>
<main>

  <section id="s-equipo" class="on">
    <div class="kpis" id="kpis"></div>
    <div class="eq-lay">
      <div class="card" style="padding:10px 12px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px"><b style="font-size:12px">Obras con tareas</b><button class="pill" id="fObraX" style="display:none">✕ todas</button></div>
        <div class="obras" id="obrasEq"></div>
      </div>
      <div class="card" style="padding:10px 12px">
        <div class="row" style="margin-bottom:8px">
          <span class="mut">Cubicador</span><span id="fCub"></span>
          <span style="width:1px;height:18px;background:#e0e0e0;margin:0 4px"></span>
          <span class="mut">USC</span><span id="fUsc"></span>
        </div>
        <table class="cal" id="calEq"></table>
        <div class="leg" id="legEq"></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px;padding:10px 12px">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><b style="font-size:12px">Tareas programadas <span class="mut" id="listaEqN"></span></b><span class="mut">la más próxima primero</span></div>
      <table class="lista" id="listaEq"></table>
    </div>
  </section>

  <section id="s-usc">
    <div class="row" style="margin-bottom:10px"><span class="mut">Sesión</span><span id="uscPills"></span></div>
    <div class="usc3">
      <div class="card c1"><div class="h">Obras</div><div class="obras" id="c1"></div></div>
      <div class="card c2">
        <div class="h">Por programar <span class="mut" id="c2n"></span></div>
        <div class="row" style="gap:6px;margin-bottom:6px">
          <span class="mut">Despacho</span><input type="date" id="c2Fecha" title="Fecha de despacho">
          <input type="text" id="c2Ton" placeholder="t" title="Toneladas estimadas por el USC" style="width:44px">
          <button class="b" id="c2Go" title="Programar las seleccionadas con esa fecha">→</button>
        </div>
        <div class="lista2" id="c2"></div>
      </div>
      <div class="card c3">
        <div class="h" id="c3h"></div>
        <table class="lista" id="c3"></table>
      </div>
    </div>
    <div class="card" style="margin-top:12px;padding:9px 11px">
      <table class="cal2" id="calUsc"></table>
    </div>
  </section>

  <section id="s-cub">
    <div class="row" style="margin-bottom:10px"><span class="mut">Sesión</span><span id="cubPills"></span></div>
    <div class="mi" id="mi"></div>
  </section>

</main>

<div class="drawer" id="drawer"><div class="p">
  <button class="x" id="drawerX">✕</button>
  <h2 id="drTit"></h2>
  <div class="row" style="margin-top:10px" id="drSect"></div>
  <div class="pisos" id="drPisos"></div>
  <div class="row" style="margin-top:10px;justify-content:space-between">
    <span class="mut" id="drCnt"></span>
    <button class="b" id="drAplicar">Aplicar</button>
  </div>
</div></div>

<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var USCS=[{ini:'DI',color:'#1565c0'},{ini:'AT',color:'#6a1b9a'},{ini:'OO',color:'#00838f'},{ini:'GM',color:'#ad1457'}];
  var SECT=['ELEV','LCIELO','VCIELO','FUND'];
  var HOY=new Date(2026,8,28), LEAD=10, CORTO=7, DIAS=['lun','mar','mié','jue','vie'];
  var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  // Las fechas vienen de un <input type=date>, que entrega '' si el usuario lo borra. Una fecha
  // inválida (NaN) haría que `sumaHabiles` no terminara nunca —getDay() de NaN nunca es hábil—,
  // así que todo lo que recibe fechas comprueba `valida` antes de iterar.
  function valida(d){ return d instanceof Date && !isNaN(d.getTime()); }
  function habil(d){ var x=d.getDay(); return x>=1&&x<=5; }
  function sumaHabiles(desde,n){ if(!valida(desde)) return desde; var d=new Date(desde.getTime()),p=n<0?-1:1,q=Math.abs(n); while(q>0){ d.setDate(d.getDate()+p); if(habil(d)) q--; } return d; }
  function habilesEntre(a,b){ if(!valida(a)||!valida(b)) return 0; var d=new Date(a.getTime()),n=0,p=b>=a?1:-1; while((p>0&&d<b)||(p<0&&d>b)){ d.setDate(d.getDate()+p); if(habil(d)) n+=p; } return n; }
  function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function corta(d){ return valida(d) ? d.getDate()+' '+MES[d.getMonth()] : '—'; }
  function deIso(s){ var p=String(s||'').split('-'); if(p.length!==3) return new Date(NaN); return new Date(+p[0],+p[1]-1,+p[2]); }
  function mismoDia(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
  function lunesDe(d){ var x=new Date(d.getTime()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
  function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function elige(l,s){ return l[hash(s)%l.length]; }
  function nomFrente(f){ if(f.libre) return f.ciclo; return ((f.piso||'').trim()||'—')+' · '+((f.ciclo||'').trim()||'—'); }
  function nomObra(o){ var s=o.obra.split(' - '); return (s[s.length-1]||o.obra).trim().slice(0,18); }
  function ordPiso(p){ var m=/^(S|P)(\d+)/i.exec(p||''); if(!m) return 999; return m[1].toUpperCase()==='S' ? -Number(m[2]) : Number(m[2]); }

  var OBRAS=[], PROG=[], CUBS=[], semOff=0, USC_SEL=USCS[0], CUB_SEL=null, FR_SEL=null, OB_ABIERTA=null, DR_OBRA=null;
  function semana(){ var l=new Date(HOY.getTime()); l.setDate(l.getDate()+7*semOff); return [0,1,2,3,4].map(function(i){ var d=new Date(l.getTime()); d.setDate(d.getDate()+i); return d; }); }

  fetch('programacion_datos.json').then(function(r){return r.json();}).then(function(D){
    CUBS=D.cubicadores.filter(function(c){ return c.ini!=='GM'; });
    var m={};
    D.frentes.forEach(function(f){
      if(!m[f.obra]) m[f.obra]={obra:f.obra,id:f.id_proyecto,frentes:[],usc:elige(USCS,'u'+f.obra),cub:elige(CUBS,'c'+f.obra),
        tipo:elige(['Cubicación','Digitación'],'t'+f.obra),origen:elige(['ArmaHub','ADetailer','aSa'],'o'+f.obra)};
      m[f.obra].frentes.push(f);
    });
    OBRAS=Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.frentes.length-a.frentes.length;});
    // USC de ejemplo repartido PAREJO sobre las obras CON TRABAJO PENDIENTE (por turnos, de la
    // que más pendiente tiene a la que menos): con un reparto al azar —o por tamaño— a un USC le
    // tocaban sólo obras al día, y su filtro vaciaba la pantalla, que parece un error.
    var porPend=OBRAS.slice().sort(function(a,b){
      var pa=a.frentes.filter(function(f){return f.estado!=='exportado';}).length, pb=b.frentes.filter(function(f){return f.estado!=='exportado';}).length;
      return pb-pa; });
    porPend.forEach(function(o,i){ o.usc=USCS[i%USCS.length]; });
    OBRAS.forEach(function(o){ o.est=estructuraDe(o); });
    // programa de ejemplo: frentes no al día, repartidos en la semana
    var cand=[]; OBRAS.forEach(function(o){ o.frentes.forEach(function(f){ if(f.estado!=='exportado') cand.push({o:o,f:f}); }); });
    cand.sort(function(a,b){ return hash(a.f.obra+a.f.sector+a.f.piso+a.f.ciclo)-hash(b.f.obra+b.f.sector+b.f.piso+b.f.ciclo); });
    // Programa de ejemplo repartido en las PRÓXIMAS CINCO SEMANAS (el calendario del equipo
    // muestra ese horizonte); lo hecho y lo atrasado sólo tiene sentido en la semana actual.
    // La muestra se toma POR USC (18 cada uno): tomada de corrido, un USC quedaba sin tareas y
    // su filtro vaciaba la pantalla.
    // El USC escribe la fecha de DESPACHO (la que maneja y no puede disfrazar); la cubicación
    // es 10 hábiles antes, calculada. «Corto» = quedan menos de 7 hábiles desde hoy hasta la
    // cubicación: no bloquea, marca. Un USC que programa el mes solo lo ve en la primera.
    var muestra=[];
    USCS.forEach(function(u){ muestra=muestra.concat(cand.filter(function(c){return c.o.usc===u;}).slice(0,18)); });
    muestra.forEach(function(c){
      var k=c.f.obra+c.f.sector+c.f.piso+c.f.ciclo;
      var despacho=sumaHabiles(HOY, 7+hash('s'+k)%30), dia=sumaHabiles(despacho,-LEAD);
      var corto=habilesEntre(HOY,dia)<CORTO, semana0=(dia>=HOY&&habilesEntre(HOY,dia)<5);
      var hecho=(semana0&&hash('h'+k)%3===0), atraso=(dia<HOY&&!mismoDia(dia,HOY)&&!hecho);
      PROG.push({o:c.o,f:c.f,cub:(hash('m'+k)%4===0)?elige(CUBS,'x'+k):c.o.cub,dia:dia,fObra:despacho,
        corto:corto,tarde:corto,ton:Math.round((3+hash('w'+k)%22)*10)/10,hecho:hecho,atraso:atraso,
        estado:hecho?'cubicada':(atraso?'en curso':(hash('e'+k)%3===0?'aceptada':'propuesta'))});
    });
    CUB_SEL=CUBS[0];
    $('intro').textContent=D.frentes.length+' frentes · '+OBRAS.length+' obras · '+CUBS.length+' cubicadores';
    $('semAnt').addEventListener('click',function(){ semOff--; todo(); });
    $('semSig').addEventListener('click',function(){ semOff++; todo(); });
    $('tabs').addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return;
      Array.prototype.forEach.call($('tabs').children,function(x){ x.classList.toggle('on',x===b); });
      ['equipo','usc','cub'].forEach(function(v){ $('s-'+v).classList.toggle('on',v===b.getAttribute('data-v')); }); });

    todo();
  }).catch(function(e){

    // su pila, no sólo "no se pudo leer" — si no, se esconde como si fuera un problema de red.
    $('intro').textContent='Error: '+e.message; if(window.console&&console.error) console.error(e.stack||e);
  });

  function todo(){

    pintarEquipo(); pintarUsc(); pintarCub();

  // ══ EQUIPO: obras con tareas · filtros · calendario de 5 semanas · lista por prioridad ══
  var F_OBRA=null, F_CUB=null, F_USC=null;
  function semanas5(){ var out=[]; for(var w=0;w<5;w++){ var l=new Date(HOY.getTime()); l.setDate(l.getDate()+7*(semOff+w));
    out.push([0,1,2,3,4].map(function(i){ var d=new Date(l.getTime()); d.setDate(d.getDate()+i); return d; })); } return out; }
  function filtrados(){ return PROG.filter(function(x){ return (!F_OBRA||x.o===F_OBRA)&&(!F_CUB||x.cub.quien===F_CUB)&&(!F_USC||x.o.usc.ini===F_USC); }); }
  function pintarEquipo(){

    var tot=enH.length, aT=enH.filter(function(x){return x.hecho&&!x.atraso;}).length, tarde=enH.filter(function(x){return x.tarde;}).length;
    var tE=enH.reduce(function(a,x){return a+x.ton;},0), tR=enH.reduce(function(a,x){return a+(x.hecho?x.ton*(0.7+(hash('r'+x.f.piso+x.f.ciclo)%80)/100):0);},0);

      '<span class="kpi"><b>'+tR.toFixed(0)+'<span style="font-size:13px;color:#b0bec5"> / '+tE.toFixed(0)+'</span></b><span>t real / est.</span></span>'+
      '<span class="kpi ojo"><b>'+tarde+'</b><span>a menos de 7 días</span></span>';
    // OBRAS con tareas programadas (respetando cubicador/USC, no la obra elegida)
    var base=PROG.filter(function(x){ return (!F_CUB||x.cub.quien===F_CUB)&&(!F_USC||x.o.usc.ini===F_USC); });
    var porObra={}; base.forEach(function(x){ var k=x.o.obra; (porObra[k]=porObra[k]||{o:x.o,n:0,p:0}); porObra[k].n++; if(!x.hecho) porObra[k].p++; });
    var obras=Object.keys(porObra).map(function(k){return porObra[k];}).sort(function(a,b){return b.p-a.p||b.n-a.n;});
    $('obrasEq').innerHTML=obras.map(function(r){ return '<div class="o'+(r.o===F_OBRA?' on':'')+'" data-o="'+esc(r.o.obra)+'" title="'+esc(r.o.obra)+' · '+r.p+' pendientes de '+r.n+'">'+
      '<span class="usc" style="background:'+r.o.usc.color+'">'+r.o.usc.ini+'</span><span class="n">'+esc(r.o.obra)+'</span>'+
      '<span class="k"><b>'+r.p+'</b>/'+r.n+'</span></div>'; }).join('')||'<span class="mut">Sin tareas.</span>';
    $('obrasEq').querySelectorAll('.o').forEach(function(el){ el.addEventListener('click',function(){
      var o=OBRAS.filter(function(x){return x.obra===el.getAttribute('data-o');})[0]; F_OBRA=(F_OBRA===o)?null:o; pintarEquipo(); }); });
    $('fObraX').style.display=F_OBRA?'':'none'; $('fObraX').onclick=function(){ F_OBRA=null; pintarEquipo(); };

    $('fCub').innerHTML=CUBS.map(function(c){ return '<button class="pill'+(F_CUB===c.quien?' on':'')+'" data-c="'+esc(c.quien)+'">'+esc(c.quien.split(' ')[0])+'</button>'; }).join(' ');
    $('fCub').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ var v=b.getAttribute('data-c'); F_CUB=(F_CUB===v)?null:v; pintarEquipo(); }); });
    $('fUsc').innerHTML=USCS.map(function(u){ return '<button class="pill'+(F_USC===u.ini?' on':'')+'" data-u="'+u.ini+'"><span class="dot" style="background:'+u.color+'"></span>'+u.ini+'</button>'; }).join(' ');
    $('fUsc').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ var v=b.getAttribute('data-u'); F_USC=(F_USC===v)?null:v; pintarEquipo(); }); });
    // CALENDARIO: 5 semanas × 5 días, compacto. El choque se marca en el día, nombrando al cubicador.

    S.forEach(function(sem,w){

          (choques.length?'<span class="ch">⚠ '+choques.join(' ')+'</span>':'')+
          dd.slice(0,6).map(function(x){ return '<span class="chip'+(x.tarde?' tarde':'')+(x.hecho?' ok':'')+'" style="background:'+x.o.usc.color+'" title="'+
            esc(x.o.obra+' · '+nomFrente(x.f)+' · '+x.cub.quien+' · '+x.o.usc.ini+(x.tarde?' · fuera de plazo':''))+'">'+esc(nomObra(x.o)+' '+nomFrente(x.f)+' · '+x.cub.ini)+'</span>'; }).join('')+
          (dd.length>6?'<span class="mas">+'+(dd.length-6)+'</span>':'')+'</td>';

    $('legEq').innerHTML=USCS.map(function(u){ return '<span><span class="dot" style="background:'+u.color+'"></span> '+u.ini+'</span>'; }).join('')+
      '<span><span class="dot" style="background:#fff;box-shadow:inset 0 0 0 2px #f9a825"></span> programado a menos de 7 días</span><span><span class="dot" style="background:#fff;box-shadow:inset 0 0 0 2px #c62828"></span> choque (3+ de 2+ USC)</span>';
    // LISTA por prioridad: pendientes por fecha, la más próxima primero; los cubicados al final.

    $('listaEqN').textContent='· '+l.length;
    $('listaEq').innerHTML='<thead><tr><th>Cubicar</th><th>En obra</th><th>Obra</th><th>Frente</th><th>Cubicador</th><th>USC</th><th style="text-align:right">t est.</th><th>Estado</th></tr></thead><tbody>'+
      l.map(function(x){ var atr=!x.hecho&&x.dia<HOY&&!mismoDia(x.dia,HOY);

        return '<tr class="'+(x.hecho?'hecho':'')+(atr?' atr':'')+'"><td>'+DIAS[(x.dia.getDay()+6)%7]+' '+corta(x.dia)+'</td><td>'+corta(x.fObra)+'</td>'+
          '<td>'+esc(x.o.obra)+'</td><td>'+esc(x.f.sector+' · '+nomFrente(x.f))+'</td><td>'+esc(x.cub.quien)+'</td>'+
          '<td><span class="usc" style="background:'+x.o.usc.color+'">'+x.o.usc.ini+'</span></td><td style="text-align:right">'+(x.ton?x.ton.toFixed(1):'—')+'</td><td>'+st+'</td></tr>'; }).join('')+'</tbody>';
  }

  // ══ ESTRUCTURA DE LA OBRA: pisos con nº de ciclos heredado hacia arriba ══
  function estructuraDe(o){
    var sect={}, pisos={};
    o.frentes.forEach(function(f){ if(f.libre) return; sect[f.sector]=1;
      var p=(f.piso||'').trim(); if(!p) return; var c=/^C(\d+)$/i.exec((f.ciclo||'').trim());
      pisos[p]=Math.max(pisos[p]||0, c?Number(c[1]):1); });
    var lista=Object.keys(pisos).sort(function(a,b){ return ordPiso(a)-ordPiso(b); }).map(function(p){ return {nom:p,ciclos:pisos[p],plano:false}; });
    // sólo se ESCRIBE el nº donde cambia respecto del piso de abajo; el resto hereda
    var prev=null; lista.forEach(function(p){ var propio=(prev===null||p.ciclos!==prev); prev=p.ciclos; if(!propio) p.ciclos=null; else p.plano=true; });
    return {sect:Object.keys(sect).length?Object.keys(sect):['ELEV'], pisos:lista};
  }
  function ciclosEfectivos(est){ var v=1,out=[]; est.pisos.forEach(function(p){ if(p.ciclos!=null) v=p.ciclos; out.push(v); }); return out; }
  function abrirDrawer(o){
    DR_OBRA=o; $('drawer').classList.add('on'); $('drTit').textContent=o.obra; pintarDrawer();
  }
  function pintarDrawer(){
    var o=DR_OBRA, e=o.est;
    $('drSect').innerHTML='<span class="mut">Sectores</span>'+SECT.map(function(s){

    $('drSect').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){
      var s=b.getAttribute('data-s'), i=e.sect.indexOf(s); if(i>=0) e.sect.splice(i,1); else e.sect.push(s); pintarDrawer(); }); });
    var ef=ciclosEfectivos(e);
    var h='<button class="addp" data-add="arriba">＋ piso arriba</button>';
    e.pisos.slice().reverse().forEach(function(p,ri){

    $('drPisos').innerHTML=h;
    $('drPisos').querySelectorAll('input').forEach(function(inp){ inp.addEventListener('change',function(){
      var v=parseInt(inp.value,10); e.pisos[Number(inp.getAttribute('data-i'))].ciclos=(v>0?v:null); pintarDrawer(); }); });
    $('drPisos').querySelectorAll('[data-h]').forEach(function(x){ x.addEventListener('click',function(){
      var i=Number(x.getAttribute('data-h')); e.pisos[i].ciclos=ef[i]; e.pisos[i].plano=false; pintarDrawer(); }); });
    $('drPisos').querySelectorAll('[data-p]').forEach(function(x){ x.addEventListener('click',function(){
      var p=e.pisos[Number(x.getAttribute('data-p'))]; p.plano=!p.plano; pintarDrawer(); }); });
    $('drPisos').querySelectorAll('[data-q]').forEach(function(x){ x.addEventListener('click',function(){

    $('drPisos').querySelectorAll('[data-add]').forEach(function(x){ x.addEventListener('click',function(){
      var arriba=(x.getAttribute('data-add')==='arriba');
      var ref=arriba?e.pisos[e.pisos.length-1]:e.pisos[0], n=ref?ordPiso(ref.nom):0;
      var nuevo=arriba?(n<0?'S'+(-n-1||0):'P'+(n+1)):(n<=0?'S'+(-n+1):'P'+(n-1||1));
      if(nuevo==='S0') nuevo='P1';

      if(arriba) e.pisos.push(p); else { e.pisos.unshift(p); if(e.pisos[1]&&e.pisos[1].ciclos==null){ e.pisos[1].ciclos=ciclosEfectivos(e)[1]; } }

    $('drCnt').textContent=e.pisos.length+' pisos · '+e.sect.length+' sectores → '+tot+' frentes ('+existen+' ya existen)';
  }
  function aplicarEstructura(){
    var o=DR_OBRA,e=o.est,ef=ciclosEfectivos(e),n=0;
    e.sect.forEach(function(s){ e.pisos.forEach(function(p,i){ for(var c=1;c<=ef[i];c++){
      if(!o.frentes.some(function(f){ return f.sector===s&&f.piso===p.nom&&f.ciclo==='C'+c; })){
        o.frentes.push({obra:o.obra,id_proyecto:o.id,sector:s,piso:p.nom,ciclo:'C'+c,estado:'pendiente',kg:0,despieces:0}); n++; } } }); });
    $('drawer').classList.remove('on'); todo();

  // ══ USC: tres cajas (obras · por programar · programadas) y el calendario de números ══
  // Caja 2 son TAREAS sin fecha (tarea = sector constructivo). Programar = ponerles fecha de
  // DESPACHO; la cubicación se calcula 10 hábiles antes. Toneladas las escribe el USC (sin
  // predicción del sistema, por ahora). Cubicador = el responsable de la obra, cambiable.
  var OB_SEL=null, CAL_CUB=null, ED_CUB=null;
  function estaProg(f){ return PROG.some(function(x){return x.f===f;}); }
  function programarTarea(o,f,despacho,ton){
    var dia=sumaHabiles(despacho,-LEAD), corto=habilesEntre(HOY,dia)<CORTO;
    PROG.push({o:o,f:f,cub:o.cub,dia:dia,fObra:despacho,corto:corto,tarde:corto,ton:ton||0,hecho:false,atraso:false,estado:'propuesta'});
  }
  function pintarUsc(){
    $('uscPills').innerHTML=USCS.map(function(u){ return '<button class="pill'+(u.ini===USC_SEL.ini?' on':'')+'" data-u="'+u.ini+'"><span class="dot" style="background:'+u.color+'"></span>'+u.ini+'</button>'; }).join(' ');
    $('uscPills').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){
      USC_SEL=USCS.filter(function(u){return u.ini===b.getAttribute('data-u');})[0]; OB_SEL=null; CAL_CUB=null; ED_CUB=null; todo(); }); });
    var mias=OBRAS.filter(function(o){return o.usc.ini===USC_SEL.ini;});
    if(!OB_SEL||mias.indexOf(OB_SEL)<0) OB_SEL=mias[0]||null;
    // CAJA 1 · obras del USC, con cuántas tareas siguen sin fecha
    $('c1').innerHTML=mias.map(function(o){ var n=o.frentes.filter(function(f){return f.estado!=='exportado'&&!estaProg(f);}).length;
      return '<div class="o'+(o===OB_SEL?' on':'')+'" data-o="'+esc(o.obra)+'" title="'+esc(o.obra)+'"><span class="n">'+esc(o.obra)+'</span><span class="k"><b>'+n+'</b></span></div>'; }).join('')||'<span class="mut">Sin obras.</span>';
    $('c1').querySelectorAll('.o').forEach(function(el){ el.addEventListener('click',function(){
      OB_SEL=OBRAS.filter(function(x){return x.obra===el.getAttribute('data-o');})[0]; CAL_CUB=null; ED_CUB=null; pintarUsc(); }); });
    // CAJA 2 · tareas sin fecha de la obra abierta; se marcan y se pasan con → y una fecha de despacho
    var disp=OB_SEL?OB_SEL.frentes.filter(function(f){return f.estado!=='exportado'&&!estaProg(f);}):[];
    $('c2n').textContent='· '+disp.length;
    $('c2').innerHTML=disp.slice(0,40).map(function(f){ return '<label class="t"><input type="checkbox" data-f="'+OB_SEL.frentes.indexOf(f)+'">'+
      esc(f.sector+' · '+nomFrente(f))+'<small>'+(f.estado==='modificado'?'cambió':'')+'</small></label>'; }).join('')+
      (disp.length>40?'<div class="mut" style="padding:4px">+'+(disp.length-40)+'</div>':'')||'<div class="mut" style="padding:6px 4px">Todo programado.</div>';
    if(!$('c2Fecha').value) $('c2Fecha').value=iso(sumaHabiles(HOY,LEAD+CORTO+3));
    $('c2Go').onclick=function(){
      var d=deIso($('c2Fecha').value); if(!valida(d)||!OB_SEL) return;
      var t=parseFloat(String($('c2Ton').value).replace(',','.'))||0;
      var marc=$('c2').querySelectorAll('input').filter(function(i){return i.checked;});
      if(!marc.length) return;
      marc.forEach(function(i){ programarTarea(OB_SEL, OB_SEL.frentes[Number(i.getAttribute('data-f'))], d, t); });
      $('c2Ton').value=''; todo();
    };
    pintarC3(); pintarCalUsc();
  }
  // CAJA 3 · programadas de la obra — o la carga de un cubicador en la semana, si se tocó su
  // nombre en el calendario (así "con cuánto quedó Emilio" se contesta acá y no ensucia el calendario)
  function pintarC3(){
    var s=semana(), filas, tit;
    if(CAL_CUB){ filas=PROG.filter(function(x){return x.cub.quien===CAL_CUB&&x.dia>=s[0]&&x.dia<=s[4];});
      tit='Carga de '+esc(CAL_CUB)+' · semana <button class="pill" id="c3Volver">← volver a la obra</button>'; }
    else { filas=OB_SEL?PROG.filter(function(x){return x.o===OB_SEL;}):[]; tit='Programadas <span class="mut">· '+esc(OB_SEL?OB_SEL.obra:'')+'</span>'; }
    filas=filas.slice().sort(function(a,b){return a.dia-b.dia;});
    var tot=filas.reduce(function(a,x){return a+(x.ton||0);},0);
    $('c3h').innerHTML=tit+'<span class="mut" style="margin-left:auto">'+filas.length+' tareas · '+tot.toFixed(1)+' t</span>';
    var vol=$('c3Volver'); if(vol) vol.addEventListener('click',function(){ CAL_CUB=null; pintarUsc(); });
    $('c3').innerHTML='<thead><tr><th>Despacho</th><th>Cubicación</th>'+(CAL_CUB?'<th>Obra</th>':'')+'<th>Tarea</th><th>Cubicador</th><th style="text-align:right">t</th><th>Estado</th><th></th></tr></thead><tbody>'+
      (filas.length?filas.map(function(x,i){
        var m=habilesEntre(HOY,x.dia), atr=(!x.hecho&&x.dia<HOY&&!mismoDia(x.dia,HOY));
        var st=x.hecho?'<span class="st h">cubicada</span>':(atr?'<span class="st a">atrasada</span>':'<span class="st p">'+esc(x.estado||'propuesta')+'</span>');
        var ro=(x.o===OB_SEL||CAL_CUB)?1:0;
        return '<tr'+(x.hecho?' class="hecho"':'')+'>'+
          '<td><input type="date" data-i="'+PROG.indexOf(x)+'" value="'+iso(x.fObra)+'"'+(CAL_CUB?' disabled':'')+'></td>'+
          '<td>'+DIAS[(x.dia.getDay()+6)%7]+' '+corta(x.dia)+(x.corto&&!x.hecho?' <span class="f7" title="Quedan '+m+' días hábiles; el estándar son '+CORTO+'">&lt; 7 días</span>':'')+'</td>'+
          (CAL_CUB?'<td>'+esc(nomObra(x.o))+'</td>':'')+
          '<td>'+esc(x.f.sector+' · '+nomFrente(x.f))+'</td>'+
          '<td><span class="cb" data-c="'+PROG.indexOf(x)+'" title="Cambiar cubicador">'+esc(x.cub.quien.split(' ')[0])+'</span>'+
            (ED_CUB===PROG.indexOf(x)?'<div class="row" style="gap:4px;margin-top:4px">'+CUBS.map(function(c){return '<button class="pill'+(c===x.cub?' on':'')+'" data-set="'+PROG.indexOf(x)+'|'+esc(c.quien)+'">'+esc(c.quien.split(' ')[0])+(c===x.o.cub?' ★':'')+'</button>';}).join('')+'</div>':'')+'</td>'+
          '<td style="text-align:right"><input class="ton" data-t="'+PROG.indexOf(x)+'" value="'+(x.ton?x.ton:'')+'" placeholder="—"'+(CAL_CUB?' disabled':'')+'></td>'+
          '<td>'+st+'</td><td>'+(CAL_CUB||x.hecho?'':'<button class="q" data-q="'+PROG.indexOf(x)+'" title="Quitar del programa">✕</button>')+'</td></tr>';
      }).join(''):'<tr><td colspan="8" class="mut">Nada programado todavía.</td></tr>')+'</tbody>';
    $('c3').querySelectorAll('input[data-i]').forEach(function(inp){ inp.addEventListener('change',function(){
      var x=PROG[Number(inp.getAttribute('data-i'))], d=deIso(inp.value); if(!valida(d)) return;
      x.fObra=d; x.dia=sumaHabiles(d,-LEAD); x.corto=x.tarde=habilesEntre(HOY,x.dia)<CORTO; todo(); }); });
    $('c3').querySelectorAll('input[data-t]').forEach(function(inp){ inp.addEventListener('change',function(){
      PROG[Number(inp.getAttribute('data-t'))].ton=parseFloat(String(inp.value).replace(',','.'))||0; todo(); }); });
    $('c3').querySelectorAll('.cb').forEach(function(el){ el.addEventListener('click',function(){
      var i=Number(el.getAttribute('data-c')); ED_CUB=(ED_CUB===i)?null:i; pintarC3(); }); });
    $('c3').querySelectorAll('[data-set]').forEach(function(b){ b.addEventListener('click',function(){
      var p=b.getAttribute('data-set').split('|'); PROG[Number(p[0])].cub=CUBS.filter(function(c){return c.quien===p[1];})[0]; ED_CUB=null; todo(); }); });
    $('c3').querySelectorAll('[data-q]').forEach(function(b){ b.addEventListener('click',function(){
      PROG.splice(Number(b.getAttribute('data-q')),1); ED_CUB=null; todo(); }); });
  }
  // CALENDARIO DE NÚMEROS · una semana, una fila por cubicador, «n · t» por día y el total.
  // Sirve para lo único que tiene que servir: ver el choque y la carga. Los chips con nombre
  // de obra viven en la pestaña Equipo, que es la de la reunión.
  function pintarCalUsc(){
    var s=semana();
    var h='<thead><tr><th class="q">Cubicador</th>'+s.map(function(d,i){ return '<th'+(mismoDia(d,HOY)?' class="hoy"':'')+'>'+DIAS[i]+'<small style="font-weight:400;color:#90a4ae">'+corta(d)+'</small></th>'; }).join('')+'<th>Semana</th></tr></thead><tbody>';
    CUBS.forEach(function(c){
      var mios=PROG.filter(function(x){return x.cub.quien===c.quien;}), wn=0, wt=0;
      h+='<tr><td class="q'+(CAL_CUB===c.quien?' on':'')+'" data-c="'+esc(c.quien)+'" title="Ver sus tareas de la semana">'+esc(c.quien)+'<small>'+esc(c.ini)+'</small></td>';
      s.forEach(function(d){
        var dd=mios.filter(function(x){return mismoDia(x.dia,d);}), u={}; dd.forEach(function(x){u[x.o.usc.ini]=1;});
        var t=dd.reduce(function(a,x){return a+(x.ton||0);},0), choque=(dd.length>=3&&Object.keys(u).length>=2);
        wn+=dd.length; wt+=t;
        h+='<td class="'+(choque?'choque':'')+(mismoDia(d,HOY)?' hoy':'')+(dd.length?'':' vac')+'" title="'+esc(dd.map(function(x){return nomObra(x.o)+' '+nomFrente(x.f)+' ('+x.o.usc.ini+')';}).join(', ')||'—')+'">'+
          (dd.length?dd.length+' · '+t.toFixed(0)+' t':'—')+(choque?'<small style="color:#c62828">'+Object.keys(u).join(' ')+'</small>':'')+'</td>';
      });
      h+='<td class="tot">'+wn+' · '+wt.toFixed(0)+' t</td></tr>';
    });
    $('calUsc').innerHTML=h+'</tbody>';
    $('calUsc').querySelectorAll('td.q').forEach(function(td){ td.addEventListener('click',function(){
      var c=td.getAttribute('data-c'); CAL_CUB=(CAL_CUB===c)?null:c; ED_CUB=null; pintarC3(); pintarCalUsc(); }); });
  }

  // ══ CUBICADOR: mi semana, día por día ══
  function pintarCub(){
    $('cubPills').innerHTML=CUBS.map(function(c){ return '<button class="pill'+(c.quien===CUB_SEL.quien?' on':'')+'" data-c="'+esc(c.quien)+'">'+esc(c.quien.split(' ')[0])+'</button>'; }).join(' ');
    $('cubPills').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ CUB_SEL=CUBS.filter(function(c){return c.quien===b.getAttribute('data-c');})[0]; pintarCub(); }); });
    var s=semana(), mios=PROG.filter(function(x){return x.cub.quien===CUB_SEL.quien;});
    $('mi').innerHTML=s.map(function(d,i){
      var dd=mios.filter(function(x){return mismoDia(x.dia,d);}).sort(function(a,b){return (b.atraso?1:0)-(a.atraso?1:0);});
      return '<div class="dia"><div class="h'+(mismoDia(d,HOY)?' hoy':'')+'">'+DIAS[i]+' '+corta(d)+' <span class="mut">· '+dd.length+'</span></div>'+
        dd.map(function(x){ return '<div class="t'+(x.hecho?' hecho':'')+(x.tarde?' tarde':'')+'" style="border-left-color:'+x.o.usc.color+'">'+
          '<div class="o">'+esc(nomObra(x.o))+'</div><div class="fr">'+esc(x.f.sector+' · '+nomFrente(x.f))+'</div>'+
          '<div class="m"><span>'+esc(x.o.usc.ini)+(x.ton?' · '+x.ton+' t':'')+(x.atraso?' · <b style="color:#c62828">atrasado</b>':'')+'</span>'+
          (x.hecho?'<span>✓</span>':(x.o.origen==='ArmaHub'?'<span title="Se marca solo al terminar el despiece">auto</span>':'<button>cubicado</button>'))+'</div></div>'; }).join('')+
        '</div>';
    }).join('');
  }
})();
</script>
</body>
</html>

  <!-- TAB: METRICS -->
  <div id="tab-inicio" class="tab-content active">
    <!-- Date range filter -->
    <div class="card" style="padding:10px 16px; margin-bottom:8px;">
      <div class="row" style="gap:6px; align-items:center; flex-wrap:wrap;">
        <span style="font-size:12px; font-weight:600; color:#666; margin-right:4px;">Periodo:</span>
        <button class="secondary btn-periodo active" onclick="setDateRange('todo')" data-range="todo" style="font-size:11px; padding:4px 10px;">Todo</button>
        <button class="secondary btn-periodo" onclick="setDateRange('semana')" data-range="semana" style="font-size:11px; padding:4px 10px;">Semana</button>
        <button class="secondary btn-periodo" onclick="setDateRange('mes')" data-range="mes" style="font-size:11px; padding:4px 10px;">Mes</button>
        <button class="secondary btn-periodo" onclick="setDateRange('anio')" data-range="anio" style="font-size:11px; padding:4px 10px;">Año</button>
        <span style="font-size:11px; color:#999; margin:0 4px;">|</span>
        <input type="date" id="fechaDesde" onchange="setDateRange('custom')" style="font-size:11px; padding:3px 6px; max-width:140px;" />
        <span style="font-size:11px; color:#999;">a</span>
        <input type="date" id="fechaHasta" onchange="setDateRange('custom')" style="font-size:11px; padding:3px 6px; max-width:140px;" />
        <span class="muted" id="dateRangeLabel" style="font-size:11px; margin-left:8px;"></span>
      </div>
    </div>

    <!-- SECTION 1: Cubicación mensual por cubicador (full width) -->
    <div class="card" style="margin-bottom:8px;">
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
        <h3 style="margin:0; font-size:14px;">📊 Cubicación mensual por cubicador</h3>
        <div class="row" style="gap:4px; align-items:center;">
          <button class="secondary" onclick="cambiarAnioMensual(-1)" style="font-size:11px; padding:2px 8px;">◀</button>
          <span id="mensualAnioLabel" style="font-size:12px; font-weight:600; min-width:40px; text-align:center;"></span>
          <button class="secondary" onclick="cambiarAnioMensual(1)" style="font-size:11px; padding:2px 8px;">▶</button>
        </div>
      </div>
      <div style="height:260px;">
        <canvas id="mensualChart"></canvas>
      </div>
    </div>

    <!-- SECTION 2: Top 15 | Cubicadores | KPI Cards -->
    <div style="display:flex; gap:8px; align-items:flex-start;">
      <!-- Top 15 proyectos -->
      <div class="card" style="flex:4; min-width:0;">
        <h3 style="font-size:13px; margin-bottom:6px;">🏗️ Top 15 proyectos (Tn)</h3>
        <div style="height:380px;">
          <canvas id="top15Chart"></canvas>
        </div>
        <div id="top15Total" style="font-size:11px; color:#555; margin-top:4px; text-align:right;"></div>
        <div style="display:flex; gap:12px; font-size:10px; color:#888; margin-top:2px;">
          <span><span style="display:inline-block; width:10px; height:8px; background:#B0BEC5; border-radius:1px; vertical-align:middle;"></span> Cargado</span>
          <span><span style="display:inline-block; width:10px; height:8px; background:#66BB6A; border-radius:1px; vertical-align:middle;"></span> Exportado</span>
        </div>
      </div>

      <!-- Cubicadores -->
      <div class="card" style="flex:4; min-width:0;">
        <h3 style="font-size:13px; margin-bottom:6px;">👷 Cubicadores (Tn)</h3>
        <div style="height:380px;">
          <canvas id="cubChart"></canvas>
        </div>
        <div id="cubTotal" style="font-size:11px; color:#555; margin-top:4px; text-align:right;"></div>
        <div style="display:flex; gap:12px; font-size:10px; color:#888; margin-top:2px;">
          <span><span style="display:inline-block; width:10px; height:8px; background:#B0BEC5; border-radius:1px; vertical-align:middle;"></span> Cargado</span>
          <span><span style="display:inline-block; width:10px; height:8px; background:#66BB6A; border-radius:1px; vertical-align:middle;"></span> Exportado</span>
        </div>
      </div>

      <!-- KPI Cards 2x5 -->
      <div style="flex:3; min-width:180px; display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Kilos Totales</div>
          <div class="kpi-value" id="kpiKilos" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Diám. Promedio</div>
          <div class="kpi-value" id="kpiDiam" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Barras Totales</div>
          <div class="kpi-value" id="kpiBarras" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Items Totales</div>
          <div class="kpi-value" id="kpiItems" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">PPB</div>
          <div class="kpi-value" id="kpiPPB" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">PPI</div>
          <div class="kpi-value" id="kpiPPI" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Cant. Cargas</div>
          <div class="kpi-value" id="kpiCargas" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Kg/Carga</div>
          <div class="kpi-value" id="kpiKgCarga" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Cant. Proyectos</div>
          <div class="kpi-value" id="kpiProyectos" style="font-size:16px;">—</div>
        </div>
        <div class="kpi-card" style="padding:10px 8px; text-align:center;">
          <div class="kpi-label" style="font-size:10px;">Última Carga</div>
          <div class="kpi-value" id="kpiUltimaCarga" style="font-size:13px;">—</div>
        </div>
      </div>
    </div>
  </div>

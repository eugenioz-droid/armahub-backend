  <!-- TAB: CALIDAD / RECLAMOS — DASHBOARDS -->
  <div id="tab-rec_dashboards" class="tab-content">
    <div class="card" style="border-top:3px solid #1565C0;">
      <h3 style="margin:0 0 16px 0; color:#1565C0;">📊 Dashboards de Reclamos</h3>

      <!-- Row 1: KPIs y overview -->
      <div style="display:grid; grid-template-columns:160px 1fr 1fr 1fr; gap:14px; margin-bottom:14px;">
        <!-- KPI Card -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:16px; text-align:center; display:flex; flex-direction:column; justify-content:center;">
          <div style="font-size:10px; color:#888; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Total</div>
          <div id="recDashTotal" style="font-size:40px; font-weight:700; color:#e53935; line-height:1;">0</div>
          <div style="font-size:11px; color:#ff9800; font-weight:600; margin-top:6px;"><span id="recDashAbiertos">0</span> abiertos</div>
        </div>
        <!-- Histórico mensual -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Histórico por Detección (mes/año)</div>
          <div style="position:relative; height:160px;"><canvas id="recDashChartHist"></canvas></div>
        </div>
        <!-- Donut resueltos/no resueltos -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Resueltos vs Pendientes</div>
          <div style="position:relative; height:160px;"><canvas id="recDashChartResueltos"></canvas></div>
        </div>
        <!-- Donut Error/Faltante/Atraso -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Tipo de Reclamo</div>
          <div style="position:relative; height:160px;"><canvas id="recDashChartTipo"></canvas></div>
        </div>
      </div>

      <!-- Row 2: Por USC y Responsable -->
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:14px;">
        <!-- Detectados por USC (bar) -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Detectados por USC</div>
          <div style="position:relative; height:200px;"><canvas id="recDashChartUSC"></canvas></div>
        </div>
        <!-- Reclamos por responsable asignado (donut) -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Por Responsable Asignado</div>
          <div style="position:relative; height:200px;"><canvas id="recDashChartCubAsig"></canvas></div>
        </div>
        <!-- Causas Ishikawa (donut) -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Causas Ishikawa</div>
          <div style="position:relative; height:200px;"><canvas id="recDashChartIshikawa"></canvas></div>
        </div>
        <!-- Kilos mal fabricados por responsable (bar) -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Kilos Mal Fabricados (Responsable)</div>
          <div style="position:relative; height:200px;"><canvas id="recDashChartKilos"></canvas></div>
        </div>
      </div>

      <!-- Row 3: Por Proyecto -->
      <div style="display:grid; grid-template-columns:1fr 2fr; gap:14px; margin-top:14px;">
        <!-- Reclamos por Proyecto (compact bar) -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Reclamos por Proyecto</div>
          <div style="position:relative; height:200px;"><canvas id="recDashChartProyecto"></canvas></div>
        </div>
        <!-- Reclamos por Proyecto desglosado por Mes - Heatmap -->
        <div style="background:#fff; border:1px solid #eee; border-radius:8px; padding:12px;">
          <div style="font-size:11px; color:#888; margin-bottom:6px;">Reclamos por Proyecto / Mes - Heatmap (últimos 12 meses)</div>
          <div id="recDashHeatmapProyectoMes" style="position:relative; height:400px;"><canvas id="recDashChartProyectoMes"></canvas></div>
        </div>
      </div>

    </div>
  </div>

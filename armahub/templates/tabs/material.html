<!-- MATERIAL DISPONIBLE (25-nov, SPECS §15) — la caluga para reciclar barras.
     Fase 1: «Disponible» (ingresar desde aSa o a mano, y la lista). Fase 2: «Coincidencias»
     (lo que la búsqueda encontró en aSa). Asignadas y Resumen llegan en la fase 3 y se suman a
     la misma fila de subpestañas.
     Hecha con el Sistema de Diseño Armacero (.arm-ds), como ArmaScanner; las barras van en la
     hoja estándar (hoja_barras.js) y se dibujan como en Auditorías.
     Lógica: features/material/index.js; servidor: material.py y material_api.py. -->
<style>
  .mat { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .mat .mat-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .mat .mat-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .mat .mat-derecha { margin-left: auto; }
  .mat .arm-button, .mat .arm-input { font-size: 13px; }
  .mat .mat-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .mat .mat-seg .arm-button { min-height: 30px; padding: 3px 10px; font-weight: 500; font-size: 12px; }
  .mat .mat-seg .arm-button.is-on { background: var(--arm-green-tint); border-color: var(--arm-green); color: #3F6B12; font-weight: 600; }
  .mat .mat-vacio { padding: 24px; text-align: center; color: var(--arm-text-muted); font-size: 13px; }
  .mat .mat-linea { font-size: 12px; color: var(--arm-text-muted); }
  .mat .mat-acc { display: flex; gap: 4px; }
  .mat .mat-acc .arm-button { min-height: 26px; padding: 2px 8px; font-size: 11px; }
  .mat tr.mat-edit > td { background: var(--arm-background); padding: 8px 10px; }
  .mat .mat-edit__caja { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
  .mat tr.mat-apagada td { color: var(--arm-text-muted); }
  .mat .audref:empty { display: none; }   /* una barra a mano no tiene marca */
  /* La ventana de ingresar */
  .mat .mat-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 950; display: flex;
                    align-items: flex-start; justify-content: center; padding: 24px 0; overflow-y: auto; }
  .mat .mat-modal__caja { background: var(--arm-surface); border-radius: var(--arm-radius-md); width: 96%;
                          max-width: 1200px; margin: auto; padding: 16px; }
  .mat .mat-modal__cabeza { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .mat .mat-modal__cabeza h3 { margin: 0; font-size: 16px; }
  .mat .mat-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
  .mat .mat-campo label { display: block; font-size: 12px; color: var(--arm-text-muted); margin-bottom: 4px; }
  .mat .mat-campo .arm-input { width: 100%; }
  .mat .mat-campo--ancho { grid-column: 1 / -1; }
  .mat .mat-figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px;
                   max-height: 52vh; overflow: auto; }
  .mat .mat-fig { border: 1px solid var(--arm-border); border-radius: var(--arm-radius-md); background: #fff;
                  padding: 6px; cursor: pointer; text-align: center; font: inherit; font-size: 12px; }
  .mat .mat-fig:hover, .mat .mat-fig:focus-visible { border-color: var(--arm-green); }
  .mat .mat-fig b { display: block; margin-top: 2px; }
  .mat .mat-fig svg { max-width: 100%; height: auto; }
  /* En la tarjeta sólo se reconoce la forma: las cotas son las de la barra de ejemplo de aSa
     y confunden; el aviso de caja también es del ejemplo. La marca «3D» se queda. */
  .mat .mat-fig svg text, .mat .mat-fig .audfigav { display: none; }
  .mat .mat-elegida { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
  .mat .mat-previa { border: 1px solid var(--arm-border); border-radius: var(--arm-radius-md); padding: 8px;
                     min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .mat .mat-previa svg { width: 300px; max-width: 100%; height: auto; }
  .mat .mat-pie { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; }
  .mat .mat-error { color: var(--arm-danger); font-size: 12px; margin-right: auto; }
  /* Coincidencias: el dibujo es el de la barra disponible (la misma forma); las cotas van en
     las columnas, que son las del ítem. */
  .mat .mat-sin-cotas .audfigcel svg text, .mat .mat-sin-cotas .audfigav { display: none; }
  .mat .mat-hacer { font-weight: 600; white-space: nowrap; }
  /* Los campos desplegables (combobox.js) y la ventana por pasos */
  .mat .mat-titulo { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .mat .mat-barra--suelta { margin-bottom: 0; }
  .mat .mat-cb { width: 220px; }
  .mat .mat-cb .arm-input { width: 100%; }
  .mat .mat-cb--ancho { width: 420px; }
  .mat .mat-pasos { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .mat .mat-paso { border: 0; background: none; font: inherit; font-size: 13px; color: var(--arm-text-muted); padding: 2px 4px; }
  .mat .mat-paso.hecho { color: var(--arm-blue); cursor: pointer; text-decoration: underline; }
  .mat .mat-paso.is-on { color: var(--arm-text); font-weight: 700; }
  .mat .mat-ccs-caja { max-height: 52vh; overflow: auto; }
  .mat tr.mat-clic { cursor: pointer; }
  .mat tr.mat-clic:hover td { background: var(--arm-green-tint); }
  .mat .mat-cant { width: 70px; min-height: 28px; padding: 2px 6px; }
  .mat .mat-listo { padding: 16px 4px; font-size: 14px; }
  @media (max-width: 900px) { .mat .mat-kpis, .mat .mat-elegida { grid-template-columns: minmax(0, 1fr); } }
</style>

<div id="tab-material" class="tab-content">
  <div class="arm-ds mat">
    <div class="arm-tabs" role="tablist" id="matSubs">
      <button type="button" class="arm-tab is-active" role="tab" aria-selected="true" data-sub="disp">Disponible</button>
      <button type="button" class="arm-tab" role="tab" aria-selected="false" data-sub="coin">Coincidencias</button>
    </div>

    <div id="matPanelDisp">
    <div class="mat-kpis">
      <div class="arm-kpi"><div class="arm-kpi__label">Barras disponibles</div><div class="arm-kpi__value" id="matKpiBarras">—</div></div>
      <div class="arm-kpi"><div class="arm-kpi__label">Kilos disponibles</div><div class="arm-kpi__value" id="matKpiKg">—</div></div>
      <div class="arm-kpi"><div class="arm-kpi__label">Ingresadas este mes</div><div class="arm-kpi__value" id="matKpiMes">—</div></div>
    </div>

    <!-- INGRESAR, ARRIBA Y APARTE DE LA LISTA (usuario, 25-nov): los campos de arriba tienen que
         servir para agregar; los filtros van dentro de la lista, o se confunden. Elegir la obra
         abre sus CC; el código directo abre sus ítems; «Crear ítem», la barra medida a mano. -->
    <div class="arm-card">
      <div class="mat-titulo">Ingresar ítem</div>
      <div class="mat-barra mat-barra--suelta">
        <div class="mat-cb mat-cb--ancho"><input type="text" id="matIngObra" class="arm-input"></div>
        <span class="mat-linea">o</span>
        <input type="text" id="matIngCc" class="arm-input" placeholder="Código de control" autocomplete="off"
               spellcheck="false" data-lpignore="true" style="width:170px;">
        <button type="button" class="arm-button" id="matIngCcIr">Ir</button>
        <span class="mat-linea">o</span>
        <button type="button" class="arm-button arm-button--primary" id="matIngCrear">Crear ítem</button>
      </div>
    </div>

    <div class="arm-card">
      <div class="mat-titulo">Ítems disponibles</div>
      <div class="mat-barra">
        <span class="mat-linea">Filtrar</span>
        <div class="mat-cb"><input type="text" id="matFiltroObra" class="arm-input"></div>
        <input type="text" id="matBuscar" class="arm-input" placeholder="Marca, CC o figura"
               autocomplete="off" spellcheck="false" data-lpignore="true" style="width:200px;">
        <div class="mat-seg" id="matEstado"></div>
        <div class="mat-seg" id="matMotivo"></div>
      </div>
      <div class="mat-seg" id="matDiam" style="margin-bottom:12px;"></div>
      <div id="matLista"></div>
    </div>
    </div><!-- fin Disponible -->

    <div id="matPanelCoin" style="display:none;">
      <div class="mat-kpis">
        <div class="arm-kpi"><div class="arm-kpi__label">Ítems que se pueden cubrir</div><div class="arm-kpi__value" id="matKpiItems">—</div></div>
        <div class="arm-kpi"><div class="arm-kpi__label">Kilos a recuperar</div><div class="arm-kpi__value" id="matKpiAhorro">—</div></div>
        <div class="arm-kpi"><div class="arm-kpi__label">Barras con coincidencia</div><div class="arm-kpi__value" id="matKpiConCoin">—</div></div>
      </div>
      <div class="arm-card">
        <div class="mat-barra">
          <input type="text" id="matCoinBuscar" class="arm-input" placeholder="Buscar CC, obra o marca"
                 autocomplete="off" spellcheck="false" data-lpignore="true" style="width:240px;">
          <div class="mat-seg" id="matCoinTipo"></div>
          <div class="mat-seg" id="matCoinEstado"></div>
          <span class="mat-linea" id="matCoinCarga"></span>
          <button type="button" class="arm-button arm-button--primary mat-derecha" id="matBuscarAhora">Buscar ahora</button>
        </div>
        <div id="matCoin"></div>
      </div>
    </div><!-- fin Coincidencias -->

    <div id="matModal" class="mat-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="matModalTit">
      <div class="mat-modal__caja">
        <div class="mat-modal__cabeza">
          <h3 id="matModalTit">Ingresar ítem</h3>
          <button type="button" class="arm-button" id="matCerrar">Cerrar</button>
        </div>
        <div class="mat-seg" id="matTipo" style="margin-bottom:12px;"></div>

        <!-- Desde aSa, por pasos: Obra › CC › Ítems › Datos. La línea de avance queda visible
             también en Datos, para volver a cualquier paso. -->
        <div class="mat-pasos" id="matPasos"></div>
        <div id="matPasoAsa">
          <div id="matAsaObra">
            <div class="mat-barra">
              <div class="mat-cb mat-cb--ancho"><input type="text" id="matObra" class="arm-input"></div>
              <span class="mat-linea">o</span>
              <input type="text" id="matCc" class="arm-input" placeholder="Tengo el CC" autocomplete="off"
                     spellcheck="false" data-lpignore="true" style="width:150px;">
              <button type="button" class="arm-button" id="matCcBuscar">Ir</button>
            </div>
          </div>
          <div id="matAsaCc" style="display:none;">
            <div class="mat-barra">
              <input type="text" id="matCcFiltro" class="arm-input" placeholder="Filtrar CC o descripción" autocomplete="off"
                     spellcheck="false" data-lpignore="true" style="width:240px;">
              <div class="mat-seg" id="matCcEstado"></div>
            </div>
            <div class="mat-ccs-caja" id="matCcs"></div>
          </div>
          <div id="matAsaItems" style="display:none;">
            <div class="mat-barra">
              <input type="text" id="matItemFiltro" class="arm-input" placeholder="Filtrar por marca" autocomplete="off"
                     spellcheck="false" data-lpignore="true" style="width:200px;">
              <span class="mat-linea" id="matItemsCuenta"></span>
              <button type="button" class="arm-button arm-button--primary mat-derecha" id="matItemsSeguir" disabled>Siguiente</button>
            </div>
            <div id="matItems"></div>
          </div>
        </div>

        <div id="matPasoMano" style="display:none;">
          <div class="mat-barra">
            <span class="mat-linea">Lados</span>
            <div class="mat-seg" id="matNLados"></div>
            <input type="text" id="matFigBuscar" class="arm-input" placeholder="Código de figura" autocomplete="off"
                   spellcheck="false" data-lpignore="true" style="width:160px;">
          </div>
          <div class="mat-figs" id="matFigs"></div>
        </div>

        <div id="matDatos" style="display:none;">
          <div class="mat-elegida">
            <div class="mat-previa" id="matPrevia"></div>
            <div>
              <div class="mat-linea" id="matResumen"></div>
              <div class="mat-campos" id="matCampos"></div>
            </div>
          </div>
          <div class="mat-pie">
            <span class="mat-error" id="matError"></span>
            <button type="button" class="arm-button" id="matVolver">Volver</button>
            <button type="button" class="arm-button" id="matGuardarOtro" style="display:none;">Guardar y crear otro</button>
            <button type="button" class="arm-button arm-button--primary" id="matGuardar">Dejar disponible</button>
          </div>
        </div>

        <div id="matListo" style="display:none;">
          <div class="mat-listo" id="matListoTxt"></div>
          <div class="mat-pie">
            <button type="button" class="arm-button" id="matOtroCc">Ingresar otro del mismo CC</button>
            <button type="button" class="arm-button arm-button--primary" id="matListoCerrar">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

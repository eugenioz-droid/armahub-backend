<!-- aSa DATA (29-sep) — los reportes que se arman sobre el espejo de aSa.
     Sub-tab «Programa Planta»: réplica del informe de Power BI. Dos tablas, «CUBICACIÓN
     EN ASA POR PROGRAMAR» y «PROGRAMADOS»; la división no es un campo de aSa, programado
     = tiene fecha comprometida (PromisedDeliveryDate). Los filtros (año · mes · obra ·
     cubicador) son los mismos segmentadores del informe original.
     Toda la data sale del espejo `asa_pedidos`, nunca de aSa en vivo. -->
<div id="tab-asa_data" class="tab-content">
  <div style="padding:4px 2px 12px;">

    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px;">
      <h3 style="margin:0; color:#558B2F;">📊 aSa Data</h3>
      <span id="dshEspejo" class="muted" style="font-size:11px;"></span>
      <div style="flex:1;"></div>
      <button id="dshSync" class="secondary" style="font-size:11px; padding:3px 10px;"
              title="Le pide a aSa los pedidos del año elegido, agregados por código de control.">↻ Traer de aSa</button>
    </div>

    <!-- Sub-tabs. Hoy sólo «Programa Planta»; los próximos reportes sobre la misma data
         espejo entran acá al lado, sin tocar nada de lo que ya funciona. -->
    <div style="display:flex; gap:2px; border-bottom:1px solid #e0e0e0; margin-bottom:10px;">
      <button id="asaSubPlanta" onclick="asaSubTab('planta')"
              style="padding:6px 16px; font-size:12px; font-weight:600; border:none; border-bottom:2px solid #8BC34A; background:none; color:#33691e; cursor:pointer;">Programa Planta</button>
    </div>

    <div id="asaPanelPlanta">

    <div id="dshAviso" class="prgaviso" style="margin-bottom:10px;"></div>

    <!-- Tres columnas: la obra a la izquierda (es la que más se usa y la que más ancho
         necesita, los nombres son largos), las dos tablas al centro y los segmentadores
         cortos a la derecha. -->
    <div class="dshwrap">

      <div class="dshcol dshobras">
        <div class="dshfh">Obra <span class="muted" id="dshObrasN" style="font-weight:400"></span></div>
        <input type="text" id="dshBuscaObra" placeholder="Buscar…" class="dshbuscar">
        <div id="dshObras" class="dshlista dshlargo"></div>
      </div>

      <div class="dshtablas">
        <div class="card dshcard">
          <div class="dshth">CUBICACIÓN EN ASA POR PROGRAMAR
            <span class="muted" id="dshPpN"></span></div>
          <div class="dshbd"><table class="dsht" id="dshPorProgramar"></table></div>
        </div>
        <div class="card dshcard">
          <div class="dshth">PROGRAMADOS <span class="muted" id="dshPgN"></span></div>
          <div class="dshbd"><table class="dsht" id="dshProgramados"></table></div>
        </div>
      </div>

      <div class="dshcol dshfiltros">
        <div class="dshf">
          <div class="dshfh">Año</div>
          <div id="dshAnios" class="dshchips"></div>
        </div>
        <div class="dshf">
          <div class="dshfh">Mes <span class="muted" style="font-weight:400">· por fecha de pedido</span></div>
          <div id="dshMeses" class="dshchips"></div>
        </div>
        <div class="dshf">
          <div class="dshfh">Cubicador <span class="muted" style="font-weight:400">· en aSa</span>
            <div style="flex:1"></div>
            <button id="dshDetElegir" class="dshmini" title="Elegir qué cubicadores se muestran">elegir</button>
          </div>
          <!-- aSa devuelve 45 DetailPerson en la historia completa, muchos son correos de
               gente que ya no cubica. El usuario elige cuáles ve como chips. -->
          <div id="dshDetLista" class="dshlista" style="display:none; max-height:34vh; margin-bottom:5px;"></div>
          <div id="dshPersonas" class="dshchips"></div>
        </div>
      </div>

    </div>

    </div><!-- /asaPanelPlanta -->

  </div>
</div>

<style>
  /* EL ALTO DEL PANEL, en un solo lugar. `stretch` iguala los tres a la altura del MÁS
     ALTO, así que si la lista de obras crece con su contenido es ella la que manda y se
     pasa de largo bajo las cajas — que es lo que estaba pasando. La solución es que el
     alto sea un número conocido: el del centro (dos cajas de 31vh + sus encabezados y el
     espacio entre ellas), y que las columnas laterales no puedan superarlo. */
  .dshwrap{display:flex; gap:12px; align-items:stretch; flex-wrap:wrap;
           --alto:calc(62vh + 88px);}
  .dshwrap > *{max-height:var(--alto);}
  .dshtablas{height:var(--alto);}
  /* Las dos columnas laterales son de ancho FIJO: si se encogieran, los chips saltarían
     de línea al cambiar de año y la pantalla bailaría. El centro se lleva el resto. */
  .dshcol{flex:none; display:flex; flex-direction:column; gap:11px;
          background:#fff; border:1px solid #e3e8ef; border-radius:8px; padding:11px 12px;}
  .dshobras{width:268px;}
  .dshfiltros{width:228px; overflow:auto;}
  .dshbuscar{width:100%; box-sizing:border-box; font-size:11px; padding:4px 7px;
             border:1px solid #cfd8dc; border-radius:4px;}
  .dshf{display:flex; flex-direction:column;}
  .dshfh{font-size:10.5px; font-weight:700; color:#546e7a; margin-bottom:5px; letter-spacing:.2px;
         display:flex; align-items:center; gap:5px;}
  .dshmini{font-size:9.5px; font-weight:600; padding:1px 7px; border-radius:99px; cursor:pointer;
           border:1px solid #dfe5ea; background:#fff; color:#607d8b;}
  .dshmini.on{background:#8BC34A; border-color:#7cb342; color:#fff}
  .dshchips{display:flex; flex-wrap:wrap; gap:4px;}
  .dshchips button{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:4px; cursor:pointer;
                   border:1px solid #dfe5ea; background:#f7f9fa; color:#607d8b;}
  .dshchips button:hover{border-color:#c5d3dc}
  .dshchips button.on{background:#8BC34A; border-color:#7cb342; color:#fff}
  .dshlista{min-height:120px; max-height:250px; overflow:auto; border:1px solid #eef1f4; border-radius:5px;}
  /* La lista de obras crece hasta el fondo de la columna, que a su vez llega hasta abajo
     de las dos cajas: así la barra de obras «cubre» ambas, sin alto fijo que adivinar. */
  .dshlargo{flex:1; max-height:none; min-height:0;}
  .dshlista label{display:flex; align-items:center; gap:5px; padding:2px 6px; font-size:10.5px;
                  cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dshlista label:hover{background:#f5f7fa}
  .dshlista input{margin:0; flex:none}

  /* Las dos cajas centrales, del MISMO ancho: ambas ocupan la columna entera, una sobre
     la otra. El alto va en vh para que las dos quepan juntas en pantalla sin scrollear
     la página — con altos fijos la segunda caía fuera del monitor. */
  .dshtablas{flex:1 1 620px; min-width:0; display:flex; flex-direction:column; gap:12px;}
  .dshcard{padding:8px 10px; margin:0; width:100%; box-sizing:border-box;}
  .dshth{font-size:11px; font-weight:700; color:#37474f; letter-spacing:.3px; margin-bottom:5px;}
  .dshth .muted{font-weight:400; letter-spacing:0;}
  /* `height`, no `max-height`: las dos cajas tienen que medir EXACTAMENTE lo mismo
     aunque una tenga 566 filas y la otra 269. Con max-height, la más corta encogía. */
  .dshbd{height:31vh; min-height:130px; overflow:auto;}
  .dsht{width:100%; border-collapse:collapse; table-layout:fixed; font-size:10px;
        font-variant-numeric:tabular-nums;}
  /* El encabezado queda pegado: la tabla se desplaza y sin esto no se sabe qué columna es cuál. */
  .dsht thead th{position:sticky; top:0; background:#fafbfc; z-index:1;
                 text-align:left; color:#546e7a; font-weight:600; padding:3px 5px;
                 border-bottom:1px solid #e3e8ef; white-space:nowrap; font-size:9.5px;}
  /* El font-size va EN LA CELDA, no sólo en la tabla: app.css trae un `td{font-size:13px}`
     (selector de elemento, valor explícito) y un valor heredado siempre pierde contra una
     declaración directa. Ponerlo sólo en `.dsht` no achicaba nada. */
  .dsht td{padding:2px 5px; border-top:1px solid #f0f2f5; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; font-size:10px; border-bottom:0;}
  .dsht tbody tr:hover td{background:#f4f8ee}
  .dsht tbody tr:nth-child(even) td{background:#fafbfc}
  .dsht .num{text-align:right}
  .dsht .cc{font-family:ui-monospace,Consolas,monospace; font-size:9.5px; color:#455a64}
  .dsht tfoot td{border-top:2px solid #cfd8dc; font-weight:700; color:#263238;
                 padding:4px 5px; background:#fff; position:sticky; bottom:0;}
  .dshvacio{color:#90a4ae; font-size:10.5px; text-align:center; padding:22px 8px;}
</style>

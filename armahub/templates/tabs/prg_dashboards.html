<!-- DASHBOARDS DE PROGRAMACIÓN (28-sep) — réplica del reporte de Power BI.
     Dos tablas: «CUBICACIÓN EN ASA POR PROGRAMAR» y «PROGRAMADOS». La división no es un
     campo de aSa: programado = tiene fecha comprometida (PromisedDeliveryDate).
     Los filtros (año · mes · obra · cubicador) son los mismos segmentadores del informe.
     La data sale del espejo `asa_pedidos`, no de aSa en vivo. -->
<div id="tab-prg_dashboards" class="tab-content">
  <div style="padding:4px 2px 12px;">

    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px;">
      <h3 style="margin:0; color:#558B2F;">📊 Cubicación en aSa</h3>
      <span id="dshEspejo" class="muted" style="font-size:11px;"></span>
      <div style="flex:1;"></div>
      <button id="dshSync" class="secondary" style="font-size:11px; padding:3px 10px;"
              title="Le pide a aSa los pedidos del año elegido, agregados por código de control.">↻ Traer de aSa</button>
    </div>

    <div id="dshAviso" class="prgaviso" style="margin-bottom:10px;"></div>

    <div class="dshwrap">
      <!-- Segmentadores, a la izquierda como en el informe -->
      <div class="dshfiltros">
        <div class="dshf">
          <div class="dshfh">Año</div>
          <div id="dshAnios" class="dshchips"></div>
        </div>
        <div class="dshf">
          <div class="dshfh">Mes <span class="muted" style="font-weight:400">· por fecha de pedido</span></div>
          <div id="dshMeses" class="dshchips"></div>
        </div>
        <div class="dshf" style="flex:1; min-height:0; display:flex; flex-direction:column;">
          <div class="dshfh">Obra</div>
          <input type="text" id="dshBuscaObra" placeholder="Buscar…"
                 style="width:100%; box-sizing:border-box; font-size:11px; padding:4px 7px; border:1px solid #cfd8dc; border-radius:4px; margin-bottom:5px;">
          <div id="dshObras" class="dshlista"></div>
        </div>
        <div class="dshf">
          <div class="dshfh">Cubicador <span class="muted" style="font-weight:400">· en aSa</span></div>
          <div id="dshPersonas" class="dshchips"></div>
        </div>
      </div>

      <!-- Las dos tablas -->
      <div class="dshtablas">
        <div class="card dshcard">
          <div class="dshth">CUBICACIÓN EN ASA POR PROGRAMAR
            <span class="muted" id="dshPpN"></span></div>
          <div class="dshbd"><table class="dsht" id="dshPorProgramar"></table></div>
        </div>
        <div class="card dshcard">
          <div class="dshth">PROGRAMADOS <span class="muted" id="dshPgN"></span></div>
          <div class="dshbd"><table class="dsht" id="dshProgramados"></table></div>
        </div>
      </div>
    </div>

  </div>
</div>

<style>
  .dshwrap{display:flex; gap:12px; align-items:stretch; flex-wrap:wrap;}
  /* La columna de filtros es fija: si se encogiera, los chips saltarían de línea al
     cambiar de año y la pantalla bailaría. */
  .dshfiltros{width:236px; flex:none; display:flex; flex-direction:column; gap:11px;
              background:#fff; border:1px solid #e3e8ef; border-radius:8px; padding:11px 12px;}
  .dshf{display:flex; flex-direction:column;}
  .dshfh{font-size:10.5px; font-weight:700; color:#546e7a; margin-bottom:5px; letter-spacing:.2px;}
  .dshchips{display:flex; flex-wrap:wrap; gap:4px;}
  .dshchips button{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:4px; cursor:pointer;
                   border:1px solid #dfe5ea; background:#f7f9fa; color:#607d8b;}
  .dshchips button:hover{border-color:#c5d3dc}
  .dshchips button.on{background:#8BC34A; border-color:#7cb342; color:#fff}
  .dshlista{flex:1; min-height:120px; max-height:250px; overflow:auto; border:1px solid #eef1f4; border-radius:5px;}
  .dshlista label{display:flex; align-items:center; gap:5px; padding:2px 6px; font-size:10.5px;
                  cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dshlista label:hover{background:#f5f7fa}
  .dshlista input{margin:0; flex:none}

  .dshtablas{flex:1 1 640px; min-width:0; display:flex; flex-direction:column; gap:12px;}
  .dshcard{padding:9px 11px; margin:0;}
  .dshth{font-size:11.5px; font-weight:700; color:#37474f; letter-spacing:.3px; margin-bottom:6px;}
  .dshth .muted{font-weight:400; letter-spacing:0;}
  .dshbd{max-height:330px; overflow:auto;}
  .dsht{width:100%; border-collapse:collapse; font-size:11px; font-variant-numeric:tabular-nums;}
  /* El encabezado queda pegado: la tabla se desplaza y sin esto no se sabe qué columna es cuál. */
  .dsht thead th{position:sticky; top:0; background:#fafbfc; z-index:1;
                 text-align:left; color:#546e7a; font-weight:600; padding:4px 6px;
                 border-bottom:1px solid #e3e8ef; white-space:nowrap; font-size:10.5px;}
  .dsht td{padding:3px 6px; border-top:1px solid #f0f2f5; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis;}
  .dsht tbody tr:nth-child(even) td{background:#fafbfc}
  .dsht .num{text-align:right}
  .dsht .cc{font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:#455a64}
  .dsht tfoot td{border-top:2px solid #cfd8dc; font-weight:700; color:#263238;
                 padding:5px 6px; background:#fff; position:sticky; bottom:0;}
  .dshvacio{color:#90a4ae; font-size:11px; text-align:center; padding:22px 8px;}
</style>
